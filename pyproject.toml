[project]
name = "personal-portfolio"
version = "0.1.0"
description = "Production-ready Django personal portfolio with HTMX, Alpine.js, Tailwind, DRF, and Supabase-ready storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "djangorestframework>=3.15",
    "django-filter>=24.2",
    "django-htmx>=1.19",
    "django-tailwind>=3.8",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "Pillow>=10.4",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.15",
]

[tool.uv]
package = false

[tool.uv.sources]
# Add any private/custom index sources here if needed

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
