{% load static %}
<!DOCTYPE html>
<html lang='en' class='scroll-smooth'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>404 - Page Not Found | Portfolio</title>
    <meta name='description' content='The page you are looking for does not exist.'>
    <script src='https://unpkg.com/htmx.org@1.9.12'></script>
    <script src='https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js'></script>
    <script>tailwind.config={theme:{extend:{colors:{tea_green:'#ccd5ae',beige:'#e9edc9',cornsilk:'#fefae0',papaya_whip:'#faedcd',light_bronze:'#d4a373'},fontFamily:{sans:['Inter','sans-serif'],display:['Cormorant Garamond','serif']},boxShadow:{soft:'0 10px 30px rgba(0,0,0,0.08)'}}}}</script>
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap' rel='stylesheet'>
</head>
<body class='bg-cornsilk text-stone-800 min-h-screen flex items-center justify-center'>
    <div class='text-center px-6 max-w-2xl'>
        <div class='mb-8'>
            <span class='text-8xl font-display font-bold text-stone-200'>404</span>
        </div>
        <h1 class='font-display text-3xl font-semibold text-stone-800 mb-4'>Page Not Found</h1>
        <p class='text-lg text-stone-500 mb-8'>The page you are looking for doesn't exist or has been moved.</p>
        <div class='flex flex-col sm:flex-row gap-4 justify-center'>
            <a href='{% url "portfolio:home" %}' class='px-8 py-3 bg-stone-800 text-cornsilk rounded-full font-semibold hover:bg-stone-700 transition-colors'>
                Return Home
            </a>
            <a href='{% url "contact:submit" %}' class='px-8 py-3 border-2 border-stone-800 text-stone-800 rounded-full font-semibold hover:bg-stone-800 hover:text-cornsilk transition-colors'>
                Contact Me
            </a>
        </div>
    </div>
</body>
</html>
