<form id='contact-form' hx-post="{% url 'contact:submit' %}" hx-target='#contact-form' hx-swap='outerHTML' class='space-y-4'>{% csrf_token %}{% for field in form %}<div><label class='block text-sm font-medium mb-1'>{{ field.label }}</label>{{ field.errors }}{{ field }}</div>{% endfor %}<button type='submit' class='w-full py-3 bg-light_bronze text-white rounded-lg font-semibold hover:bg-amber-700 transition-colors'>Send Message</button></form>
