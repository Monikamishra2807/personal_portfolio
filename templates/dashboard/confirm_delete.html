{% extends 'dashboard/index.html' %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<div class='min-h-screen pt-20 px-6 pb-12'>
  <div class='max-w-xl mx-auto'>
    <div class='bg-red-50 border border-red-200 rounded-2xl p-8 shadow-soft'>
      <div class='text-center'>
        <div class='w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4'>
          <svg class='w-8 h-8 text-red-600' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
            <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16'></path>
          </svg>
        </div>
        <h1 class='font-display text-3xl font-semibold text-charcoal mb-4'>Delete {{ object }}</h1>
        <p class='text-charcoal-light mb-6'>Are you sure you want to delete this item? This action cannot be undone.</p>

        <form method='post' class='flex gap-4 justify-center'>
          {% csrf_token %}
          <button type='submit' class='px-6 py-3 bg-red-600 text-white font-semibold rounded-xl hover:bg-red-700 transition shadow-soft'>
            Yes, Delete
          </button>
          <a href='{% if redirect_url %}{% url redirect_url %}{% else %}javascript:history.back(){% endif %}' class='px-6 py-3 border-2 border-charcoal text-charcoal rounded-xl font-semibold hover:bg-charcoal hover:text-white transition'>
            Cancel
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
