<form hx-post="{% url 'dashboard:project_create' %}" hx-target='#project-list' hx-swap='beforeend' class='space-y-4'>{% csrf_token %}{% for field in project_form %}<div><label class='block text-sm font-medium text-stone-600 mb-1'>{{ field.label }}</label>{{ field.errors }}{{ field }}</div>{% endfor %}<button type='submit' class='px-6 py-2 bg-stone-800 text-cornsilk rounded-full text-sm font-semibold hover:bg-stone-700 transition-colors'>Add Project</button></form>
