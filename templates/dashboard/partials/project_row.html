<div class='flex items-center justify-between py-3'><div><p class='font-medium text-charcoal'>{{ project.title }}</p><p class='text-sm text-charcoal-lighter'>{{ project.short_description|truncatechars:60 }}</p></div><span class='text-xs px-2 py-1 {% if project.is_featured %}bg-terracotta/30 text-charcoal{% else %}bg-cream-dark text-charcoal-lighter{% endif %} rounded-full'>{% if project.is_featured %}Featured{% else %}Draft{% endif %}</span></div>
