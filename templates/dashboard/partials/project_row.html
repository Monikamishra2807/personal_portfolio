<div class='flex items-center justify-between py-3'><div><p class='font-medium text-stone-800'>{{ project.title }}</p><p class='text-sm text-stone-400'>{{ project.short_description|truncatechars:60 }}</p></div><span class='text-xs px-2 py-1 {% if project.is_featured %}bg-tea_green/60 text-stone-700{% else %}bg-stone-100 text-stone-400{% endif %} rounded-full'>{% if project.is_featured %}Featured{% else %}Draft{% endif %}</span></div>
