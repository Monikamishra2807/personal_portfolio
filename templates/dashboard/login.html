{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class='min-h-screen flex items-center justify-center px-6'>
  <div class='w-full max-w-sm bg-cornsilk rounded-2xl p-8 shadow-soft'>
    <h1 class='font-display text-2xl font-semibold text-stone-800 mb-6 text-center'>Dashboard Login</h1>
    <form method='post' class='space-y-4'>
      {% csrf_token %}
      <div>
        <label class='block text-sm text-stone-500 mb-1'>Username</label>
        <input type='text' name='username' required class='w-full rounded-xl border border-stone-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-tea_green'>
      </div>
      <div>
        <label class='block text-sm text-stone-500 mb-1'>Password</label>
        <input type='password' name='password' required class='w-full rounded-xl border border-stone-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-tea_green'>
      </div>
      {% if form.errors %}
        <p class='text-red-500 text-xs text-center'>Invalid username or password.</p>
      {% endif %}
      <button type='submit' class='w-full bg-tea_green text-stone-800 font-medium rounded-xl py-2.5 hover:opacity-80 transition'>Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
