<footer class='py-12 px-6 border-t border-stone-200 bg-beige/30'>
  <div class='max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-4'>
    <p class='text-stone-400 text-sm'>{{ site_profile.name|default:'Portfolio' }} &copy; {% now 'Y' %}</p>
    <div class='flex gap-4'>{% for link in site_social_links %}<a href='{{ link.url }}' target='_blank' rel='noopener noreferrer' class='text-stone-400 hover:text-stone-700 text-sm transition-colors'>{{ link.platform }}</a>{% endfor %}</div>
  </div>
</footer>
